server:
  port: 8102

spring:
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  application:
    name: park-energy-data
  datasource:
    url: jdbc:mysql://115.159.222.238:3306/park_energy_system?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: admin
    password: Saki#Mygo06
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: ParkDataPool
      maximum-pool-size: ${DATA_DB_POOL_MAX_SIZE:6}
      minimum-idle: ${DATA_DB_POOL_MIN_IDLE:0}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:2000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:10000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:60000}
      keepalive-time: 0
      connection-test-query: SELECT 1
      data-source-properties:
        connectTimeout: ${DB_CONNECT_TIMEOUT_MS:3000}
        socketTimeout: ${DB_SOCKET_TIMEOUT_MS:8000}
        tcpKeepAlive: true
  rabbitmq:
    host: 115.159.222.238
    port: 5672
    username: admin
    password: Saki#Mygo06
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
        retry:
          enabled: false
  data:
    redis:
      host: 115.159.222.238
      port: 6379
      password: ""
      timeout: 3s

park:
  rabbitmq:
    exchange: park.energy.exchange
    raw-data-queue: raw_electric_data
    raw-data-routing-key: data.raw
    alarm-queue: gateway_alarm_upload
    alarm-routing-key: alarm.raw
  data:
    consumer-enabled: true
    message-dedup-ttl-minutes: 60
    realtime-ttl-minutes: 30
    iotdb:
      enabled: true
      driver-class-name: org.apache.iotdb.jdbc.IoTDBDriver
      jdbc-url: jdbc:iotdb://115.159.222.238:6667/
      username: root
      password: root
      storage-group: root.park_energy.device

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
